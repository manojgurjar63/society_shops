<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shopkeeper Dashboard · Society Shops</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="dash-body">

<button class="sidebar-toggle">☰</button>
<div class="sidebar-overlay"></div>

<aside class="sidebar">
    <div class="sidebar-brand">🏪 <span>Society Shops</span></div>
    <div class="sidebar-role">Shopkeeper Panel</div>
    <nav class="sidebar-nav">
        <a href="#" class="nav-item active"><span class="ni">📊</span> Dashboard</a>
        <a href="#register" class="nav-item"><span class="ni">➕</span> Register Shop</a>
        <a href="#myshops" class="nav-item"><span class="ni">🏬</span> My Shops</a>
    </nav>
    <div class="sidebar-divider"></div>
    <a th:href="@{/web/logout}" class="sidebar-logout">⏻ Logout</a>
</aside>

<div class="dash-main">
    <header class="dash-header">
        <div>
            <div class="dash-title">My Dashboard</div>
            <div class="dash-subtitle">Manage your shops and inventory</div>
        </div>
        <div class="header-right">
            <div class="avatar" title="Shopkeeper">S</div>
        </div>
    </header>

    <div class="dash-content">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div class="stats-row">
            <div class="stat-card sc-blue">
                <div class="sc-icon">🏬</div>
                <div class="sc-info">
                    <div class="sc-val" th:text="${shops.size()}">0</div>
                    <div class="sc-lbl">Total Shops</div>
                </div>
            </div>
            <div class="stat-card sc-green">
                <div class="sc-icon">✅</div>
                <div class="sc-info">
                    <div class="sc-val" th:text="${approvedCount}">0</div>
                    <div class="sc-lbl">Approved</div>
                </div>
            </div>
            <div class="stat-card sc-yellow">
                <div class="sc-icon">⏳</div>
                <div class="sc-info">
                    <div class="sc-val" th:text="${pendingCount}">0</div>
                    <div class="sc-lbl">Pending</div>
                </div>
            </div>
        </div>

        <div class="card" id="register">
            <div class="card-header">
                <h3>➕ Register New Shop</h3>
                <button class="btn btn-outline btn-sm" onclick="toggleForm('shopForm')">▲ Hide Form</button>
            </div>
            <div id="shopForm" class="collapsible">
                <form th:action="@{/web/shopkeeper/shops/register}" th:object="${shopRequest}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Shop Name *</label>
                            <input type="text" th:field="*{name}" placeholder="e.g. Ramesh Grocery" required />
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <input type="text" th:field="*{category}" placeholder="e.g. Grocery, Pharmacy" />
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" th:field="*{phone}" placeholder="Contact number" />
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" th:field="*{address}" placeholder="Block A, Shop 12" />
                        </div>
                        <div class="form-group">
                            <label>Opening Time</label>
                            <input type="time" th:field="*{openTime}" />
                        </div>
                        <div class="form-group">
                            <label>Closing Time</label>
                            <input type="time" th:field="*{closeTime}" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" th:field="*{description}" placeholder="Brief description of your shop" />
                    </div>
                    <button type="submit" class="btn btn-primary">🏪 Register Shop</button>
                </form>
            </div>
        </div>

        <div class="card" id="myshops">
            <div class="card-header">
                <h3>🏬 My Shops</h3>
                <span class="badge-pill badge-blue" th:text="${shops.size()} + ' shops'"></span>
            </div>
            <div th:if="${shops.empty}" class="empty-state">
                <div class="empty-icon">🏪</div><p>No shops yet. Register one above.</p>
            </div>
            <div class="shop-cards" th:if="${!shops.empty}">
                <div class="shop-tile" th:each="shop : ${shops}">
                    <div class="shop-tile-top">
                        <div class="shop-tile-icon">🏪</div>
                        <div class="shop-tile-info">
                            <div class="shop-tile-name" th:text="${shop.name}"></div>
                            <div><span class="tag" th:text="${shop.category}"></span></div>
                        </div>
                        <div class="shop-tile-badges">
                            <span th:text="${shop.status}" th:class="${shop.status.name() == 'OPEN'} ? 'badge badge-open' : 'badge badge-closed'"></span>
                            <span th:if="${shop.isApproved}" class="badge badge-approved">Approved</span>
                            <span th:unless="${shop.isApproved}" class="badge badge-pending">Pending</span>
                        </div>
                    </div>
                    <div class="shop-tile-meta">
                        <span>🕐 <span th:text="${shop.openTime} + ' – ' + ${shop.closeTime}"></span></span>
                        <span>📍 <span th:text="${shop.address}"></span></span>
                    </div>
                    <div class="shop-tile-actions">
                        <form th:if="${shop.isApproved}" th:action="@{/web/shopkeeper/shops/{id}/toggle(id=${shop.id})}" method="post" style="display:inline;">
                            <button type="submit"
                                th:class="${shop.status.name() == 'OPEN'} ? 'btn btn-warning btn-sm' : 'btn btn-success btn-sm'"
                                th:text="${shop.status.name() == 'OPEN'} ? '🔴 Close Shop' : '🟢 Open Shop'">
                            </button>
                        </form>
                        <a th:href="@{/web/shopkeeper/shops/{id}/inventory(id=${shop.id})}" class="btn btn-secondary btn-sm">📦 Inventory</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="confirm-overlay" id="confirmDialog">
    <div class="confirm-box">
        <h4>Are you sure?</h4>
        <p id="confirmMsg"></p>
        <div class="confirm-actions">
            <button class="btn btn-danger" onclick="confirmYes()">Yes, proceed</button>
            <button class="btn btn-outline" onclick="confirmNo()">Cancel</button>
        </div>
    </div>
</div>

<script th:src="@{/css/dashboard.js}"></script>
</body>
</html>
